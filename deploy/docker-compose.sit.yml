# =============================================================================
# Sub2API Docker Compose - SIT (Hardcoded Configuration)
# =============================================================================
#
# Start:
#   docker compose -f docker-compose.sit.yml up -d
#
# Access:
#   http://117.162.7.154:8200
# =============================================================================

services:
  sub2api:
    image: ccr.ccs.tencentyun.com/iskaola/koala-docker-service:sub2api-v1.0.0
    container_name: sub2api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - '0.0.0.0:8200:8200'
    volumes:
      - ./data:/app/data
    environment:
      # =========================================================================
      # Core Server Configuration
      # =========================================================================
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8200
      - SERVER_MODE=release
      - ENABLE_SERVER_TIMING=false
      - RUN_MODE=standard
      - TZ=Asia/Shanghai

      # =========================================================================
      # Logging Configuration
      # =========================================================================
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - LOG_SERVICE_NAME=sub2api
      - LOG_ENV=sit
      - LOG_CALLER=true
      - LOG_STACKTRACE_LEVEL=error
      - LOG_OUTPUT_TO_STDOUT=true
      - LOG_OUTPUT_TO_FILE=true

      # =========================================================================
      # PostgreSQL Database Configuration
      # =========================================================================
      - DATABASE_HOST=postgresql
      - DATABASE_PORT=5432
      - DATABASE_USER=root
      - DATABASE_PASSWORD=chen1995
      - DATABASE_DBNAME=postgres
      - DATABASE_SSLMODE=disable
      - DATABASE_MAX_OPEN_CONNS=50
      - DATABASE_MAX_IDLE_CONNS=10
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=30
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=5

      # =========================================================================
      # Redis Configuration
      # =========================================================================
      - REDIS_HOST=redis-stack
      - REDIS_PORT=6379
      - REDIS_USERNAME=
      - REDIS_PASSWORD=chen1995
      - REDIS_DB=0
      - REDIS_POOL_SIZE=1024
      - REDIS_MIN_IDLE_CONNS=10
      - REDIS_ENABLE_TLS=false

      # =========================================================================
      # Admin User Configuration
      # =========================================================================
      - ADMIN_EMAIL=admin@sub2api.local
      - ADMIN_PASSWORD=chen1995

      # =========================================================================
      # JWT & Security Configuration
      # =========================================================================
      - JWT_SECRET=7e605e2e7308ce2494a0c248d6df2fbd68325059a5d205ca6c2104b21948fb93
      - JWT_EXPIRE_HOUR=24
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=0
      - TOTP_ENCRYPTION_KEY=75ededf6f3eb7641e7cc0a282b5222eaf0e23843f7e3c8fa9affaa371043d331

      # =========================================================================
      # Setup & Update Configuration
      # =========================================================================
      - SETUP_MIGRATION_TIMEOUT_SECONDS=0
      - UPDATE_GITHUB_TOKEN=
      - UPDATE_PROXY_URL=

      # =========================================================================
      # Security URL Allowlist Configuration
      # =========================================================================
      - SECURITY_URL_ALLOWLIST_ENABLED=false
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=true
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=true
      - SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS=

      # =========================================================================
      # Gemini OAuth Configuration
      # =========================================================================
      - GEMINI_OAUTH_CLIENT_ID=
      - GEMINI_OAUTH_CLIENT_SECRET=
      - GEMINI_OAUTH_SCOPES=
      - GEMINI_QUOTA_POLICY=
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=

      # =========================================================================
      # Antigravity OAuth Configuration
      # =========================================================================
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=
      - ANTIGRAVITY_USER_AGENT_VERSION=

      # =========================================================================
      # Gateway OpenAI Configuration
      # =========================================================================
      - GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT=0
      - GATEWAY_OPENAI_HTTP2_ENABLED=true
      - GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1=true
      - GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD=2
      - GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS=60
      - GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS=600
      - GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_FAILURE_THRESHOLD=2
      - GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_WINDOW_SECONDS=60
      - GATEWAY_OPENAI_PROXY_STREAM_CIRCUIT_TTL_SECONDS=600

      # =========================================================================
      # Gateway Image Streaming Configuration
      # =========================================================================
      - GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT=900
      - GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL=10

      # =========================================================================
      # Gateway Image Concurrency Configuration
      # =========================================================================
      - GATEWAY_IMAGE_CONCURRENCY_ENABLED=false
      - GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS=0
      - GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE=reject
      - GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS=30
      - GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS=100

    networks:
      - work-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '5', '-O', '/dev/null', 'http://localhost:8200/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  work-net:
    external: true
